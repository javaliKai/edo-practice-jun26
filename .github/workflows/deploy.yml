name: Deploy MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --upgrade pip

      - run: pip install mkdocs mkdocs-material mkdocs-material-extensions pymdown-extensions ghp-import

      - run: mkdocs build

      - run: ghp-import -n -p -f site
